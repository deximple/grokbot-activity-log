name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the supported floor. It is pinned to an older image because
          # setup-python does not guarantee 3.8 builds for ubuntu-latest; do not
          # raise the floor to work around a missing build.
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          # The newest interpreters run the unit tests with DeprecationWarning as an error,
          # so a call that is about to be removed fails here first.
          - os: ubuntu-latest
            python-version: "3.13"
            pyflags: "-W error::DeprecationWarning"
          - os: ubuntu-latest
            python-version: "3.14"
            pyflags: "-W error::DeprecationWarning"
          - os: macos-latest
            python-version: "3.12"
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q gblog.py tests
      - name: Unit tests
        run: python ${{ matrix.pyflags }} -m unittest discover -s tests -v
      - name: Unit tests (non-UTC time zone, C locale, ASCII stdio)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          TZ: Asia/Seoul
          LC_ALL: C
          PYTHONIOENCODING: ascii
        run: python -m unittest discover -s tests
      - name: Smoke test CLI
        env:
          GBLOG_ROOT: ${{ runner.temp }}/gblog-smoke
          PYTHONWARNINGS: error::DeprecationWarning
        run: |
          ./bin/gblog init
          TID=$(./bin/gblog task-start --bot ci --task "smoke test")
          ./bin/gblog log --bot ci --task-id "$TID" --action shell --target "echo hi" --outcome ok
          ./bin/gblog task-end --bot ci --task-id "$TID" --outcome ok --summary x
          ./bin/gblog export --bot ci | grep '"detail": "x"' >/dev/null
          ./bin/gblog verify --all
          ./bin/gblog report --bot ci
          ./bin/gblog status
          ./bin/gblog coverage
          ./bin/gblog tune --stdout
          ./bin/gblog anchor
          rc=0
          ./bin/gblog verify --bot nosuchbot || rc=$?
          if [ "$rc" -ne 1 ]; then echo "verify --bot nosuchbot exited $rc, expected 1"; exit 1; fi
          if [ -e "$GBLOG_ROOT/logs/nosuchbot" ]; then echo "verify created a chain for an unknown bot"; exit 1; fi
          # a reserved bot name must be refused for a new chain (exit 2, nothing created)
          rc=0
          ./bin/gblog note --bot aliases --detail x || rc=$?
          if [ "$rc" -ne 2 ]; then echo "note --bot aliases exited $rc, expected 2"; exit 1; fi
          if [ -e "$GBLOG_ROOT/logs/aliases" ]; then echo "a reserved bot name created a chain"; exit 1; fi
          ./bin/gblog verify --all --json | python -c 'import json,sys; json.load(sys.stdin)'
          ./bin/gblog verify --all --strict
          ./bin/gblog status --bot ci --root "$GBLOG_ROOT"
          # state lost: rebuild it from the log tail, then the chain must verify again
          rm "$GBLOG_ROOT/state/ci.json"
          ./bin/gblog state rebuild --bot ci
          test -f "$GBLOG_ROOT/state/ci.json"
          ./bin/gblog verify --bot ci
          ./bin/gblog spool list
          python3 - <<'PY'
          import glob, os
          f = glob.glob(os.environ["GBLOG_ROOT"] + "/logs/ci/*.jsonl")[0]
          with open(f) as fh:
              s = fh.read().replace("echo hi", "rm -rf /")
          with open(f, "w") as fh:
              fh.write(s)
          PY
          if ./bin/gblog verify --bot ci; then echo "tamper not detected"; exit 1; fi

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: "0"
      GBLOG_ROOT: ${{ runner.temp }}/gblog-scripts
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh and bin/gblog
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck install.sh bin/gblog
      - name: Lint the embedded shell hook
        run: |
          # SC1007 is excluded on purpose: the hook's `HISTTIMEFORMAT= builtin history 1`
          # is an intentional empty per-command assignment. The hook text lives in gblog.py.
          ./bin/gblog capture shell-hook --bot ci > hook.sh && bash -n hook.sh && shellcheck -s bash -e SC1007 hook.sh
      - name: Launcher works through a symlink
        run: |
          T="$(mktemp -d)"
          ln -s "$PWD/bin/gblog" "$T/gblog-abs"
          mkdir -p "$T/sub"
          ln -s "../gblog-abs" "$T/sub/gblog-rel"
          "$T/gblog-abs" --version
          "$T/sub/gblog-rel" --version
      - name: Install from the checkout into a temp HOME
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/home"
          HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/ledger" bash ./install.sh
          "$T/bin/gblog" --version
          test -d "$T/ledger/logs"
          grep -q '# gblog PATH' "$T/home/.profile"
          grep -q '# gblog ROOT' "$T/home/.profile"
          grep -q 'export GBLOG_ROOT=' "$T/home/.profile"
          # a rerun must not change the rc file
          cp "$T/home/.profile" "$T/profile.before"
          HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/ledger" bash ./install.sh
          cmp "$T/profile.before" "$T/home/.profile"
      - name: Install handles a relative root, legacy rc lines and ~/.bash_profile
        run: |
          SRC="$PWD"
          T="$(mktemp -d)"
          mkdir -p "$T/home" "$T/work"
          # unmarked lines for the same prefix and root (as an older install or a user wrote them) are not duplicated
          printf 'export PATH="%s:$PATH"\nexport GBLOG_ROOT=%s\n' "$T/bin" "$T/work/ledger" > "$T/home/.bashrc"
          cp "$T/home/.bashrc" "$T/bashrc.before"
          : > "$T/home/.bash_profile"
          ( cd "$T/work" && HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT=ledger bash "$SRC/install.sh" )
          # the relative root was resolved against the directory the installer ran in
          test -d "$T/work/ledger/logs"
          cmp "$T/bashrc.before" "$T/home/.bashrc"
          # an existing ~/.bash_profile is handled and gets the absolute root
          grep -q '# gblog PATH' "$T/home/.bash_profile"
          grep -q '# gblog ROOT' "$T/home/.bash_profile"
          grep -q '^export GBLOG_ROOT=/.*/work/ledger$' "$T/home/.bash_profile"
          if [ -e "$T/home/.profile" ]; then echo "~/.profile was created although rc files exist"; exit 1; fi
          # a rerun (again with the relative root) changes nothing
          cp "$T/home/.bash_profile" "$T/bash_profile.before"
          ( cd "$T/work" && HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT=ledger bash "$SRC/install.sh" )
          cmp "$T/bashrc.before" "$T/home/.bashrc"
          cmp "$T/bash_profile.before" "$T/home/.bash_profile"
          # a different unmarked GBLOG_ROOT is reported with both values and gets no second block
          printf 'export GBLOG_ROOT=/somewhere/else\n' > "$T/home/.zshrc"
          HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/work/ledger" bash ./install.sh 2> "$T/err.txt"
          cat "$T/err.txt" >&2
          grep -q '^warning: .*/somewhere/else' "$T/err.txt"
          grep -q '^warning: .*/work/ledger' "$T/err.txt"
          if grep -q '# gblog ROOT' "$T/home/.zshrc"; then echo "a second GBLOG_ROOT block was added to .zshrc"; exit 1; fi
          if [ "$(grep -c 'export GBLOG_ROOT=' "$T/home/.zshrc")" -ne 1 ]; then echo "GBLOG_ROOT was duplicated in .zshrc"; exit 1; fi
      - name: Piped install ignores a gblog.py in the current directory
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/home" "$T/decoy"
          echo 'raise SystemExit("decoy gblog.py was installed")' > "$T/decoy/gblog.py"
          SRC="$PWD"
          ( cd "$T/decoy" && HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/ledger" GBLOG_REPO="file://$SRC" bash < "$SRC/install.sh" )
          "$T/bin/gblog" --version
          cmp "$SRC/gblog.py" "$T/bin/gblog"
      - name: GBLOG_SHA256 is enforced
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/home"
          GOOD="$(sha256sum gblog.py | cut -d' ' -f1)"
          BAD="$(printf '%064d' 0)"
          HOME="$T/home" GBLOG_PREFIX="$T/good" GBLOG_ROOT="$T/ledger" GBLOG_SHA256="$GOOD" bash ./install.sh
          "$T/good/gblog" --version
          if HOME="$T/home" GBLOG_PREFIX="$T/bad" GBLOG_ROOT="$T/ledger" GBLOG_SHA256="$BAD" bash ./install.sh; then
            echo "checksum mismatch was not detected"; exit 1
          fi
          if [ -e "$T/bad/gblog" ]; then echo "gblog was installed despite a checksum mismatch"; exit 1; fi
      - name: An https source is never redirected to another scheme
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/home" "$T/stub" "$T/cwd"
          SRC="$PWD"
          # A stand-in for curl: it records its arguments and "downloads" the checkout's gblog.py. No network is used.
          cat > "$T/stub/curl" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$CURL_ARGS"
          out=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "-o" ]; then out="${2:-}"; fi
            shift
          done
          [ -n "$out" ] && cp "$CURL_SRC" "$out"
          SH
          chmod +x "$T/stub/curl"
          (
            cd "$T/cwd"
            export PATH="$T/stub:$PATH" CURL_ARGS="$T/https.args" CURL_SRC="$SRC/gblog.py"
            HOME="$T/home" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/ledger" GBLOG_REPO="https://mirror.invalid/gblog" bash < "$SRC/install.sh"
          )
          cat "$T/https.args"
          cmp "$SRC/gblog.py" "$T/bin/gblog"
          grep -qx -- '--proto-redir' "$T/https.args"
          grep -qx -- '=https' "$T/https.args"
          grep -qxF -- 'https://mirror.invalid/gblog/gblog.py' "$T/https.args"
          # any other source (here file://) is fetched exactly as before
          (
            cd "$T/cwd"
            export PATH="$T/stub:$PATH" CURL_ARGS="$T/file.args" CURL_SRC="$SRC/gblog.py"
            HOME="$T/home" GBLOG_PREFIX="$T/bin2" GBLOG_ROOT="$T/ledger" GBLOG_REPO="file://$SRC" bash < "$SRC/install.sh"
          )
          cat "$T/file.args"
          cmp "$SRC/gblog.py" "$T/bin2/gblog"
          if grep -q -- 'proto-redir' "$T/file.args"; then echo "--proto-redir was passed for a non-https source"; exit 1; fi

  restricted-env:
    name: restricted env (py${{ matrix.python-version }}, ASCII stdio, read-only HOME)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a read-only HOME
        run: |
          # HOME is switched per step (not for the whole job), so checkout and setup-python keep their real HOME.
          RO_HOME="$RUNNER_TEMP/ro-home"
          mkdir -p "$RO_HOME"
          chmod 0555 "$RO_HOME"
          if ( : > "$RO_HOME/probe" ) 2>/dev/null; then
            echo "::error::$RO_HOME is still writable (is this job running as root?); the read-only HOME checks would prove nothing"
            exit 1
          fi
          echo "RO_HOME=$RO_HOME" >> "$GITHUB_ENV"
      - name: Unit tests (ASCII stdio, read-only HOME)
        env:
          PYTHONIOENCODING: ascii
        run: |
          export HOME="$RO_HOME"
          python -m unittest discover -s tests
      - name: CLI with ASCII stdio and a read-only HOME
        env:
          PYTHONIOENCODING: ascii
        run: |
          export HOME="$RO_HOME"
          # A ledger outside HOME works as usual. Text that ASCII cannot encode is escaped, never fatal.
          export GBLOG_ROOT="$RUNNER_TEMP/gblog-restricted"
          ./bin/gblog init
          ./bin/gblog alias add --slug buero --display "Büro Chef"
          ./bin/gblog note --bot buero --detail "café ☕ visit"
          ./bin/gblog tail -n 1 | grep -F 'Chef(buero)' >/dev/null
          ./bin/gblog status | grep -F 'Chef(buero)' >/dev/null
          for cmd in "tail -n 1" "status" "report --stdout" "alias list" "export"; do
            # every byte written to an ASCII stdout must be ASCII
            # shellcheck disable=SC2086
            ./bin/gblog $cmd | python -c 'import sys; sys.stdin.buffer.read().decode("ascii")'
          done
          ./bin/gblog export | python -c 'import json,sys; [json.loads(line) for line in sys.stdin]'
          ./bin/gblog verify --all
          # A ledger root under the read-only HOME: a write is a one-line error (exit 2), never a traceback,
          # and the read-only commands still answer without creating anything.
          export GBLOG_ROOT="$HOME/activity-log"
          rc=0
          ./bin/gblog note --bot ci --detail x 2> "$RUNNER_TEMP/ro-err.txt" || rc=$?
          cat "$RUNNER_TEMP/ro-err.txt" >&2
          if [ "$rc" -ne 2 ]; then echo "note under a read-only HOME exited $rc, expected 2"; exit 1; fi
          grep -q '^error: ' "$RUNNER_TEMP/ro-err.txt"
          if grep -q 'Traceback' "$RUNNER_TEMP/ro-err.txt"; then echo "a traceback was printed for a read-only ledger root"; exit 1; fi
          ./bin/gblog status
          ./bin/gblog verify --all
          if [ -n "$(ls -A "$HOME")" ]; then echo "something was written into the read-only HOME"; ls -la "$HOME"; exit 1; fi
      - name: install.sh with a read-only HOME
        env:
          PYTHONIOENCODING: ascii
        run: |
          T="$(mktemp -d)"
          rc=0
          HOME="$RO_HOME" GBLOG_PREFIX="$T/bin" GBLOG_ROOT="$T/ledger" bash ./install.sh > "$T/out.txt" 2> "$T/err.txt" || rc=$?
          cat "$T/out.txt"
          cat "$T/err.txt" >&2
          if [ "$rc" -ne 0 ]; then echo "install.sh exited $rc with a read-only HOME, expected 0"; exit 1; fi
          HOME="$RO_HOME" "$T/bin/gblog" --version
          test -d "$T/ledger/logs"
          # The startup file could not be written: that is a warning, and the script must say so.
          grep -q '^warning: could not write ' "$T/err.txt"
          grep -q '^no shell startup file could be written' "$T/out.txt"
          if grep -q 'already configured' "$T/out.txt"; then echo "install.sh claimed the shell was already configured"; exit 1; fi
          if [ -n "$(ls -A "$RO_HOME")" ]; then echo "install.sh wrote into the read-only HOME"; ls -la "$RO_HOME"; exit 1; fi
